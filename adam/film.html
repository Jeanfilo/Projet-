<script>
"use strict";
// "Le commencement d'Adam" — 60 s, 1080x1920, 30 fps. Every frame is a pure function of time.
// Visual rule enforced by construction: only landscapes, sky, light, particles and geometry. No figures of any kind.
const W=1080,H=1920,FPS=30,DUR=60;
const gl=document.getElementById('gl').getContext('webgl2',{antialias:false,alpha:false,depth:true,preserveDrawingBuffer:true});
if(!gl.getExtension('EXT_color_buffer_float'))throw new Error('float render targets unavailable');

// ---------------- math ----------------
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,x)=>a+(b-a)*x, P=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>(x=clamp(x),x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2), easeO=x=>1-Math.pow(1-clamp(x),3), sm=x=>(x=clamp(x),x*x*(3-2*x));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// smooth spline through keyframes [[t,v],...] (Catmull-Rom tangents, eased ends)
function KS(kf,t){const n=kf.length;if(t<=kf[0][0])return kf[0][1];if(t>=kf[n-1][0])return kf[n-1][1];
  let i=1;while(kf[i][0]<t)i++;const[t0,v0]=kf[i-1],[t1,v1]=kf[i],h=t1-t0,s=(t-t0)/h;
  const m=j=>j<=0||j>=n-1?0:(kf[j+1][1]-kf[j-1][1])/(kf[j+1][0]-kf[j-1][0]);const m0=m(i-1)*h,m1=m(i)*h,s2=s*s,s3=s2*s;
  return(2*s3-3*s2+1)*v0+(s3-2*s2+s)*m0+(-2*s3+3*s2)*v1+(s3-s2)*m1}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function persp(fovy,a,n,f){const t=1/Math.tan(fovy/2),nf=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0])}
function lookAt(e,c,up){const z=norm(sub(e,c)),x=norm(cross(up,z)),y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o}
function project(VP,p){const x=p[0],y=p[1],z=p[2],m=VP,w=m[3]*x+m[7]*y+m[11]*z+m[15];
  return[((m[0]*x+m[4]*y+m[8]*z+m[12])/w+1)/2,((m[1]*x+m[5]*y+m[9]*z+m[13])/w+1)/2,w]}

// Plates: a reference camera at the origin sees the whole image; depth turns it into a relief we can fly through.
const FOV0=50*Math.PI/180,TH0=Math.tan(FOV0/2),PA=3072/5504,TW0=TH0*PA;
const refDir=(u,v)=>[(u-.5)*2*TW0,(.5-v)*2*TH0,-1];
function makeCam(e,target,roll,fov){const V=lookAt(e,target,[Math.sin(roll),Math.cos(roll),0]),Pm=persp(fov,W/H,.02,400);
  return{V,P:Pm,VP:mul(Pm,V),eye:e,focal:H/2/Math.tan(fov/2)}}
// Z = zoom on the plate, (cu,cv) = plate point at frame centre (v from top), (ex,ey,ez) = camera translation
function cam({Z=1,cu=.5,cv=.5,ex=0,ey=0,ez=0,roll=0}){const e=[ex,ey,ez],d=refDir(cu,cv);
  return makeCam(e,[e[0]+d[0],e[1]+d[1],e[2]+d[2]],roll,2*Math.atan(TH0/Z))}
function orbit(target,R,yaw,pitch,roll=0,fovDeg=50){const e=[target[0]+R*Math.sin(yaw)*Math.cos(pitch),target[1]+R*Math.sin(pitch),target[2]+R*Math.cos(yaw)*Math.cos(pitch)];
  return makeCam(e,target,roll,fovDeg*Math.PI/180)}

// ---------------- GL plumbing ----------------
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));return s}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}return{p,u}}
function texParams(min,mag,wrap){gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,min);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,mag);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrap);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrap)}
function fbo(w,h,{depth=false,fmt='f16'}={}){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  if(fmt==='f16')gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  texParams(gl.LINEAR,gl.LINEAR,gl.CLAMP_TO_EDGE);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  if(depth){const r=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,r);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,w,h);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,r)}
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('fbo incomplete');return{f,t,w,h}}
function bind(target){if(target){gl.bindFramebuffer(gl.FRAMEBUFFER,target.f);gl.viewport(0,0,target.w,target.h)}else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H)}}
function clearTo(c){gl.clearColor(c[0],c[1],c[2],1);gl.clearDepth(1);gl.depthMask(true);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT)}
function useTex(unit,tex,loc){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc,unit)}

const VS_FS=`#version 300 es
layout(location=0) in vec2 aP;out vec2 vUV;void main(){vUV=aP*.5+.5;gl_Position=vec4(aP,0.,1.);}`;
const HDR=`#version 300 es
precision highp float;precision highp int;in vec2 vUV;out vec4 o;`;
const FS={
noise:HDR+`
float h(vec2 p){uvec2 q=uvec2(ivec2(p)+ivec2(4096));q*=uvec2(1597334673u,3812015801u);uint n=(q.x^q.y)*1597334673u;return float(n)/4294967295.;}
float vn(vec2 p,float per,float sd){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
 return mix(mix(h(mod(i,per)+sd),h(mod(i+vec2(1,0),per)+sd),u.x),mix(h(mod(i+vec2(0,1),per)+sd),h(mod(i+vec2(1,1),per)+sd),u.x),u.y);}
float fbm(vec2 p,float per,float sd){float s=0.,a=.5,n=0.;for(int k=0;k<6;k++){s+=a*vn(p,per,sd);n+=a;p*=2.;per*=2.;a*=.5;}return s/n;}
void main(){vec2 p=vUV*4.;o=vec4(fbm(p,4.,0.),fbm(p*2.,8.,57.),fbm(p,4.,113.),fbm(p*4.,16.,231.));}`,
puff:HDR+`uniform sampler2D uN;
void main(){vec2 q=vUV*2.-1.;float r=length(q);float n=texture(uN,vUV*.7+.13).r*.6+texture(uN,vUV*1.9+.4).b*.4;
 float a=(1.-smoothstep(.1,1.,r))*smoothstep(.32,.72,n+(.55-r)*.45);o=vec4(a);}`,
copy:HDR+`uniform sampler2D uSrc;void main(){o=vec4(texture(uSrc,vUV).rgb,1.);}`,
bright:HDR+`uniform sampler2D uSrc;uniform float uThr;
void main(){vec3 c=texture(uSrc,vUV).rgb;float l=max(c.r,max(c.g,c.b));o=vec4(c*smoothstep(uThr,uThr+.4,l),1.);}`,
blur:HDR+`uniform sampler2D uSrc;uniform vec2 uDir;
void main(){vec3 c=texture(uSrc,vUV).rgb*.227027;c+=(texture(uSrc,vUV+uDir*1.3846).rgb+texture(uSrc,vUV-uDir*1.3846).rgb)*.316216;
 c+=(texture(uSrc,vUV+uDir*3.2308).rgb+texture(uSrc,vUV-uDir*3.2308).rgb)*.070270;o=vec4(c,1.);}`,
rays:HDR+`uniform sampler2D uSrc;uniform vec2 uLight;uniform float uDecay,uDensity;
void main(){vec2 uv=vUV,d=(uv-uLight)*uDensity/56.;vec3 c=vec3(0.);float w=1.;
 for(int i=0;i<56;i++){uv-=d;c+=texture(uSrc,clamp(uv,0.,1.)).rgb*w;w*=uDecay;}o=vec4(c/56.,1.);}`,
mix:HDR+`uniform sampler2D uA,uB;uniform float uX,uFlash;uniform vec3 uFlashCol;
void main(){vec3 a=texture(uA,vUV).rgb,b=texture(uB,vUV).rgb;float v=length(vUV-.5);o=vec4(mix(a,b,uX)+uFlashCol*uFlash*(1.15-v),1.);}`,
comp:HDR+`uniform sampler2D uSrc,uB1,uB2,uB3,uB4,uRays;uniform float uBloom,uRaysAmt,uExposure,uSat,uContrast,uVig,uGrain,uSeed,uFade,uCA,uTop,uStreak;
uniform vec3 uLift,uGain,uFadeCol,uRaysCol;
float hh(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
vec3 shoulder(vec3 c){return mix(c,.72+.28*(1.-exp(-(c-.72)/.28)),step(.72,c));}
void main(){vec2 d=vUV-.5;float ca=uCA*dot(d,d);
 vec3 c=vec3(texture(uSrc,vUV-d*ca).r,texture(uSrc,vUV).g,texture(uSrc,vUV+d*ca).b);
 vec3 b=texture(uB1,vUV).rgb*.35+texture(uB2,vUV).rgb*.3+texture(uB3,vUV).rgb*.22+texture(uB4,vUV).rgb*.18;
 vec3 st=vec3(0.);for(int i=-7;i<=7;i++){float fi=float(i);st+=texture(uB4,vUV+vec2(fi*.04,0.)).rgb*exp(-abs(fi)*.28);}
 c+=b*uBloom+texture(uRays,vUV).rgb*uRaysCol*uRaysAmt+st*vec3(.55,.7,1.)*uStreak*.22;
 c*=uExposure*(1.-uTop*smoothstep(.4,1.,vUV.y));float l=dot(c,vec3(.2126,.7152,.0722));c=max(mix(vec3(l),c,uSat),0.);
 c=(c-.45)*uContrast+.45;c=c*uGain+uLift*(1.-clamp(c,0.,1.));c=shoulder(max(c,0.));
 c*=1.-uVig*smoothstep(.25,.85,length(d*vec2(.75,1.)));c=mix(c,uFadeCol,uFade);
 c+=(hh(vUV*vec2(1080.,1920.)+uSeed)-.5)*uGrain;o=vec4(clamp(c,0.,1.),1.);}`,
neb3:HDR+`uniform sampler2D uN;uniform float uTime,uAmt;
void main(){vec2 p=vec2(vUV.x*.5625,vUV.y);vec3 c=mix(vec3(.002,.004,.014),vec3(.008,.014,.040),vUV.y);
 float n=textureLod(uN,p*.32+vec2(uTime*.003,0.),3.).r,m=textureLod(uN,p*.55-vec2(0.,uTime*.004),2.).g;float nb=smoothstep(.46,.74,n*.72+m*.36);
 float v=1.-smoothstep(.2,.9,length((vUV-.5)*vec2(1.,.8)));c+=(nb*vec3(.022,.034,.085)+pow(nb,4.)*vec3(.06,.045,.02))*uAmt*(.5+.5*v);o=vec4(c,1.);}`,
celestial:HDR+`uniform sampler2D uN;uniform float uTime,uSpread,uSep,uShAmt;uniform vec2 uSh;
void main(){vec2 p=vec2(vUV.x*.5625,vUV.y);float t=uTime;
 vec2 q=vec2(textureLod(uN,p*.42+vec2(t*.008,0.),1.5).g,textureLod(uN,p*.42+vec2(.37,.11)-vec2(0.,t*.006),1.5).b);
 float f=textureLod(uN,p*.62+q*.55+vec2(0.,-t*.01),1.).r*.72+textureLod(uN,p*1.5+q*.3+vec2(t*.01,0.),.5).g*.38;f=smoothstep(.42,.74,f);
 vec3 c=mix(vec3(.003,.006,.022),vec3(.010,.020,.064),vUV.y)+f*vec3(.024,.05,.14);
 vec2 L=vec2(.12,1.1);float d=length(p-L),sp=max(uSpread,.01);
 float glow=exp(-d/sp*1.6),ang=atan(p.y-L.y,p.x-L.x);
 float rays=smoothstep(.48,.86,texture(uN,vec2(ang*.9,t*.012)).a)*exp(-d/(sp*1.35));
 vec3 gold=vec3(1.,.80,.46);c+=gold*glow*(.06+f*1.1)+gold*rays*.24+vec3(1.,.95,.85)*pow(glow,4.)*.8;
 vec2 s=(p-uSh)*vec2(1.,1.85);float n2=texture(uN,p*1.6+vec2(t*.01,-t*.007)).r;
 float sd=length(s)-.16-(n2-.5)*.17;float m=(1.-smoothstep(-.03,.11,sd))*uShAmt;
 c=mix(c,vec3(.005,.004,.012)+vec3(.018,.012,.035)*n2,m*.96);
 float facing=clamp(dot(normalize(L-uSh),normalize(p-uSh+1e-4))*.8+.2,0.,1.);
 c+=gold*exp(-abs(sd-.1*uSep)*26.)*uSep*.45*facing*(1.-m);o=vec4(c,1.);}`,
clouds:HDR+`uniform sampler2D uN;uniform float uDen,uRise;uniform vec2 uSun;
void main(){vec2 p=vec2(vUV.x*.5625,vUV.y);float a=0.;vec3 col=vec3(0.);
 for(int i=3;i>=0;i--){float fi=float(i),sc=.28+fi*.2;vec2 off=vec2(fi*.37,-uRise*(.5+fi*.45));
  float n=textureLod(uN,p*sc+off,1.).r*.7+textureLod(uN,p*sc*2.3+off*1.3,.5).g*.3;float th=mix(.30,.70,1.-uDen);
  float d=smoothstep(th,th+.2,n)*.8;vec3 lit=mix(vec3(.50,.55,.70),vec3(1.,.86,.62),clamp(1.-length(vUV-uSun)*.85,0.,1.))*(.3+1.05*n);
  col=col*(1.-d)+lit*d;a=a+(1.-a)*d;}
 o=vec4(col,a);}`,
};
const VS_PLATE=`#version 300 es
layout(location=0) in vec2 aUV;uniform mat4 uVP;uniform sampler2D uDepth,uTex;uniform vec2 uHalf;uniform float uInvNear,uInvFar,uTime,uSway;
out vec2 vUV;out float vD;
void main(){vec2 uv=clamp(aUV,0.,1.);float d=texture(uDepth,uv).r;float dist=1./mix(uInvFar,uInvNear,d);
 vec3 p=vec3((aUV.x-.5)*2.*uHalf.x,(.5-aUV.y)*2.*uHalf.y,-1.)*dist;
 if(uSway>0.){vec3 c=textureLod(uTex,uv,5.).rgb;float fol=smoothstep(.0,.10,c.g-max(c.r,c.b)*.92);
  float w=sin(uTime*1.25+aUV.y*8.+aUV.x*3.)+.5*sin(uTime*2.1+aUV.x*13.);p.x+=w*uSway*fol*dist*(.3+d);p.y+=cos(uTime*1.05+aUV.x*7.)*uSway*.5*fol*dist;}
 vUV=uv;vD=d;gl_Position=uVP*vec4(p,1.);}`;
const FS_PLATE=`#version 300 es
precision highp float;in vec2 vUV;in float vD;uniform sampler2D uTex,uNoise;
uniform float uFocus,uDof,uTime,uExposure,uMist,uSparkle,uSparkMin,uSkyExp;uniform vec3 uTint,uMistCol;out vec4 o;
const vec2 PO[8]=vec2[8](vec2(-.326,-.406),vec2(-.840,-.074),vec2(-.696,.457),vec2(-.203,.621),vec2(.962,-.195),vec2(.473,-.480),vec2(.519,.767),vec2(.185,-.893));
void main(){float coc=clamp(abs(vD-uFocus)*uDof,0.,1.);vec2 ts=vec2(textureSize(uTex,0));vec2 r=vec2(1.,ts.x/ts.y)*coc*.013;float lod=log2(1.+coc*20.);
 vec3 c=vec3(0.);for(int i=0;i<8;i++)c+=texture(uTex,clamp(vUV+PO[i]*r,0.,1.),lod).rgb;c/=8.;
 float l=dot(c,vec3(.299,.587,.114));
 if(uSparkle>0.){float n=texture(uNoise,vUV*vec2(7.,12.5)+vec2(uTime*.03,-uTime*.02)).r;float tw=pow(max(0.,sin(n*44.+uTime*5.)),14.);c+=smoothstep(.8,.97,l)*smoothstep(uSparkMin,uSparkMin+.15,vD)*tw*uSparkle*vec3(1.,.95,.82);}
 if(uMist>0.){float m=texture(uNoise,vUV*vec2(1.1,1.9)+vec2(uTime*.011,0.)).g;float far=1.-vD;float band=smoothstep(.15,.55,far)*(1.-smoothstep(.75,1.,far));
  c=mix(c,uMistCol,clamp((m-.35)*2.2*uMist*band,0.,.55));}
 c*=mix(uSkyExp,1.,smoothstep(.02,.2,vD));o=vec4(c*uTint*uExposure,1.);}`;
const VS_PTS=`#version 300 es
layout(location=0) in vec3 aPos;layout(location=1) in vec4 aCol;layout(location=2) in float aSize;layout(location=3) in float aAux;
uniform mat4 uV,uP;uniform float uFocal,uFocus,uBokeh,uMaxPx;out vec4 vCol;out float vSoft,vAux;
void main(){vec4 vp=uV*vec4(aPos,1.);gl_Position=uP*vp;float z=max(-vp.z,.001);float s=aSize*uFocal/z,coc=abs(1./z-1./uFocus)*uBokeh;
 float s0=max(s,1.3),S=clamp(s0+coc,1.,uMaxPx);gl_PointSize=vp.z>-.03?0.:S;float e=s0/S;
 vCol=vec4(aCol.rgb,aCol.a*e*e*min(1.,s/1.3+.2));vSoft=clamp(coc/S,0.,1.);vAux=aAux;}`;
const FS_PTS=`#version 300 es
precision highp float;uniform int uKind;uniform sampler2D uPuff;in vec4 vCol;in float vSoft,vAux;out vec4 o;
void main(){vec2 q=gl_PointCoord*2.-1.;float r2=dot(q,q);if(r2>1.)discard;float a;
 if(uKind==0){float g=exp(-r2*6.)+.16*exp(-r2*1.6);a=mix(g,(1.-smoothstep(.8,1.,sqrt(r2)))*.5,vSoft);}
 else{float c=cos(vAux),s=sin(vAux);a=texture(uPuff,mat2(c,-s,s,c)*q*.5+.5).r;}

 o=vec4(vCol.rgb*vCol.a*a,vCol.a*a);}`;

const PRG={plate:program(VS_PLATE,FS_PLATE),pts:program(VS_PTS,FS_PTS)};
for(const k in FS)PRG[k]=program(VS_FS,FS[k]);

// geometry
const QUAD=(()=>{const vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);return vao})();
const GRID=(()=>{const NX=220,NY=394,E=.08,v=new Float32Array(NX*NY*2);let k=0;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){v[k++]=-E+(1+2*E)*i/(NX-1);v[k++]=-E+(1+2*E)*j/(NY-1)}
  const idx=new Uint32Array((NX-1)*(NY-1)*6);k=0;
  for(let j=0;j<NY-1;j++)for(let i=0;i<NX-1;i++){const a=j*NX+i,b=a+1,c=a+NX,d=c+1;idx[k++]=a;idx[k++]=c;idx[k++]=b;idx[k++]=b;idx[k++]=c;idx[k++]=d}
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  return{vao,n:idx.length}})();

const SHOTS=[[0,4.9,shotGalaxy],[3.9,14.4,shotEarth],[13.8,21.6,shotKnowledge],[20.6,27.8,shotCelestial],[26.8,35.3,shotGarden],[34.3,41.2,shotLeaves],[40.2,51.0,shotMountains],[50.0,60.01,shotAerial]];

function mixGrade(a,b,x){const o={};for(const k in a)o[k]=Array.isArray(a[k])?a[k].map((v,i)=>lerp(v,b[k][i],x)):lerp(a[k],b[k],x);return o}

const tx=document.getElementById('tx').getContext('2d');
const SUBS=subtitleChunks();
function star8(x,y,r,alpha,rot=0,lw=2){tx.save();tx.translate(x,y);tx.rotate(rot);tx.globalAlpha=alpha;tx.strokeStyle='#E9C27A';tx.lineWidth=lw;tx.shadowColor='rgba(255,200,120,.6)';tx.shadowBlur=12;

function wrap(text,maxW){const words=text.split(' ');if(tx.measureText(text).width<=maxW)return[text];let best=null;
  for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(' '),b=words.slice(i).join(' '),w=Math.max(tx.measureText(a).width,tx.measureText(b).width);if(w<=maxW&&(!best||w<best[2]))best=[a,b,w]}
